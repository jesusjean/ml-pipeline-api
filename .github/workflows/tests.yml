name: Run Tests

on:
  push:
    branches:
      - main

jobs:
  test: #runs pytest and confirms the API still works
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest
  
  build: #confirms the Dockerfile can still build the image
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ml-pipeline-api:test .

  deploy: #triggers Render's Deploy Hook
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render deploy
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }} # ref=$GITHUB_SHA tells Render exactly which commit to deploy
        run: curl -fsS -X POST "${DEPLOY_HOOK}&ref=${GITHUB_SHA}" 


  verify: #confirms that the correct commit is actually live
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - name: Verify deployed commit
        run: |
          for attempt in {1..20}; do
            DEPLOYED_SHA=$(curl -fsS "https://ml-pipeline-api-29u7.onrender.com/model-info" | python3 -c "import sys, json; print(json.load(sys.stdin)['commit_sha'])")

            if [ "$DEPLOYED_SHA" = "$GITHUB_SHA" ]; then
              echo "Correct commit is live!"
              exit 0
            fi

            echo "Expected: $GITHUB_SHA"
            echo "Found: $DEPLOYED_SHA"
            echo "New version not live yet. Trying again..."
            sleep 20
          done

          echo "The expected commit did not become live."
          exit 1